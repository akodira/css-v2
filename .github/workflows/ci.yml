name: CI

# All checks run on Windows Server 2022 build machines (rented from GitHub for each run, then deleted),
# the same OS as production:
#   1. build      - compile, run the unit tests, build Angular, make the IIS release package
#   2. deploy-test - install SQL Server 2022 (with Full-Text Search), IIS, Hosting Bundle and URL Rewrite,
#                    run deploy/Install-Ccs.ps1 exactly as on the real server, then test through HTTPS
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, package (Windows Server 2022)
    runs-on: windows-2022
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Ccs.Web/package-lock.json
      - name: Restore and build
        run: |
          dotnet restore Ccs.slnx
          dotnet build Ccs.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test Ccs.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory test-results
      - name: Publish API (win-x64, framework-dependent)
        run: dotnet publish src/Ccs.Api/Ccs.Api.csproj -c Release -r win-x64 --self-contained false -o release/ccs-api
      - name: Build web
        working-directory: src/Ccs.Web
        run: |
          npm ci
          npx ng build --configuration production
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/ccs-web, release/database, release/migration, release/docs | Out-Null
          Copy-Item -Recurse src/Ccs.Web/dist/Ccs.Web/browser/* release/ccs-web/
          Copy-Item database/* release/database/ -Recurse
          Copy-Item migration/* release/migration/ -Recurse
          Copy-Item docs/* release/docs/ -Recurse
          Copy-Item deploy/Install-Ccs.ps1, deploy/Install-Ccs.cmd release/
          "commit $env:GITHUB_SHA built $(Get-Date -Format o)" | Set-Content release/VERSION.txt
      - uses: actions/upload-artifact@v6
        with:
          name: ccs-v2-release-${{ github.sha }}
          path: release
          retention-days: 30
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: test-results

  deploy-test:
    name: Deploy to IIS + SQL Server 2022 and test (Windows Server 2022)
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ccs-v2-release-${{ github.sha }}
          path: D:\Releases\ci
      - name: Install SQL Server 2022 Developer with Full-Text Search
        shell: pwsh
        run: |
          choco install sql-server-2022 -y --no-progress --params="'/IgnorePendingReboot /FEATURES:SQLENGINE,FULLTEXT /INSTANCENAME:MSSQLSERVER'"
          if ($LASTEXITCODE -notin 0, 3010) { throw "SQL Server install failed: $LASTEXITCODE" }
          $tools = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\Client SDK\ODBC' -Recurse -Filter sqlcmd.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tools) { $tools.DirectoryName | Out-File -Append $env:GITHUB_PATH }
      - name: Install IIS roles, Hosting Bundle, URL Rewrite
        shell: pwsh
        run: |
          Install-WindowsFeature Web-Server, Web-Default-Doc, Web-Static-Content, Web-Http-Errors, Web-Http-Logging, `
            Web-Request-Monitor, Web-Filtering, Web-Stat-Compression, Web-Dyn-Compression, Web-AppInit, Web-WebSockets, `
            Web-Mgmt-Console -IncludeManagementTools | Out-Null
          Invoke-WebRequest https://aka.ms/dotnet/10.0/dotnet-hosting-win.exe -OutFile $env:TEMP\hosting.exe
          Start-Process $env:TEMP\hosting.exe -ArgumentList '/install', '/quiet', '/norestart' -Wait
          choco install urlrewrite -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "URL Rewrite install failed: $LASTEXITCODE" }
          net stop was /y; net start w3svc
      - name: Run Install-Ccs.ps1 (same script as production)
        shell: pwsh
        run: |
          Add-Content "$env:windir\System32\drivers\etc\hosts" "`n127.0.0.1 ccs.test"
          & D:\Releases\ci\Install-Ccs.ps1 -HostName ccs.test -AdminEmail admin@ccs.test -AdminPassword 'Str0ng!Passw0rd' -Quiet
      - name: Run it again (update path must be safe)
        shell: pwsh
        run: '& D:\Releases\ci\Install-Ccs.ps1 -HostName ccs.test -Quiet'
      - name: Smoke tests through https://ccs.test
        shell: pwsh
        run: |
          function Check($name, $ok) { if ($ok) { Write-Host "PASS  $name" } else { throw "FAIL  $name" } }
          $home_ = Invoke-WebRequest https://ccs.test/en -UseBasicParsing
          Check 'home page /en serves Angular' ($home_.StatusCode -eq 200 -and $home_.Content -match '<app-root')
          Check 'stylesheet loads without inline script (CSP-safe)' ($home_.Content -match '<link rel="stylesheet" href="styles-[^"]+\.css">' -and $home_.Content -notmatch 'media="print"')
          $deep = Invoke-WebRequest https://ccs.test/ar/tickets -UseBasicParsing
          Check 'deep link /ar/tickets falls back to index.html' ($deep.StatusCode -eq 200 -and $deep.Content -match '<app-root')
          $h = Invoke-WebRequest https://ccs.test/api/health -UseBasicParsing
          Check 'API health at /api' ($h.Content -match 'Healthy')
          Check 'HSTS header' ($home_.Headers['Strict-Transport-Security'] -match 'max-age')
          Check 'CSP header' ($home_.Headers['Content-Security-Policy'] -match "default-src 'self'")
          $site = Invoke-RestMethod https://ccs.test/api/site
          Check 'site settings JSON' ($null -ne $site)
          try { Invoke-WebRequest https://ccs.test/api/tickets -UseBasicParsing | Out-Null; $code = 200 } catch { $code = [int]$_.Exception.Response.StatusCode }
          Check "anonymous /api/tickets refused (got $code)" ($code -eq 401)
          $body = @{ identifier = 'admin@ccs.test'; password = 'Str0ng!Passw0rd' } | ConvertTo-Json
          $session = Invoke-RestMethod https://ccs.test/api/auth/sign-in -Method Post -ContentType 'application/json' -Body $body
          Check 'administrator signs in' ($session.accessToken -or $session.token -or $session.mfaToken)
          if ($session.accessToken) {
            $h = @{ Authorization = "Bearer $($session.accessToken)" }
            function Api($m, $u, $b) { if ($null -eq $b) { Invoke-RestMethod "https://ccs.test/api/admin/$u" -Method $m -Headers $h } else { Invoke-RestMethod "https://ccs.test/api/admin/$u" -Method $m -Headers $h -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes(($b | ConvertTo-Json -Depth 5))) } }
            $org = Api Post organizations @{ name = 'CI Org'; isActive = $true; sharedAccessEnabled = $false }
            Check 'admin creates an organization' ($org.id)
            $br = Api Post branches @{ organizationId = $org.id; name = 'CI Branch'; isActive = $true }
            Check 'admin creates a branch' ($br.id)
            $team = Api Post teams @{ nameEn = 'CI Team'; nameAr = 'فريق'; isActive = $true }
            Check 'admin creates a team' ($team.id)
            $agent = Api Post users @{ fullName = 'CI Agent'; email = 'agent@ccs.test'; password = 'Str0ng!Passw0rd'; role = 'agent' }
            Check 'admin creates a staff member' ($agent.id)
            Api Put "teams/$($team.id)/members" @{ members = @(@{ userId = $agent.id; isLeader = $false }) } | Out-Null
            $teams = Api Get teams $null
            Check 'team has the new member' (($teams.teams | Where-Object id -eq $team.id).members.Count -eq 1)
            $ty = Api Post account-types @{ nameEn = 'CI Type'; nameAr = 'نوع'; allAccess = $false; permissions = @('reply'); access = @(@{ organizationId = $org.id }) }
            Api Put "account-types/$($ty.id)" @{ nameEn = 'CI Type 2'; nameAr = 'نوع 2'; allAccess = $true; permissions = @('reply','resolve'); access = @() } | Out-Null
            $types = @(Api Get account-types $null)
            Check 'account types list and edit' (@($types | Where-Object { $_.id -eq $ty.id -and $_.nameEn -eq 'CI Type 2' -and $_.permissions.Count -eq 2 }).Count -eq 1)
            $cust = Api Post users @{ fullName = 'CI Customer'; email = 'cust@ccs.test'; password = 'Str0ng!Passw0rd'; role = 'customer'; organizationId = $org.id; branchId = $br.id }
            $list = Api Get 'users?kind=customers' $null
            Check 'customers list shows the new customer' (@($list | Where-Object id -eq $cust.id).Count -eq 1)
            Api Delete "users/$($cust.id)" $null | Out-Null
            try { Api Delete "organizations/$($org.id)" $null | Out-Null; $code = 200 } catch { $code = [int]$_.Exception.Response.StatusCode }
            Check "organization in use is protected (got $code)" ($code -eq 409)
            $cat = Api Post categories @{ nameEn = 'CI Category'; nameAr = 'فئة'; isActive = $true; sortOrder = 1; autoAssign = $true; isPrivate = $false; defaultTeamId = $team.id }
            $sub = Api Post subcategories @{ categoryId = $cat.id; nameEn = 'CI Sub'; nameAr = 'فرعية'; isActive = $true; sortOrder = 1 }
            $tt = Api Post ticket-types @{ nameEn = 'CI Type'; nameAr = 'نوع تذكرة'; sortOrder = 1; isActive = $true; categoryIds = @($cat.id) }
            $fld = Api Post fields @{ key = 'ci_choice'; labelEn = 'CI choice'; labelAr = 'اختيار'; type = 'dropdown'; options = @(@{ value = 'a'; labelEn = 'A' }, @{ value = 'b'; labelEn = 'B' }); visibleToCustomer = $true; isActive = $true; sortOrder = 1 }
            $pr = Api Post priorities @{ nameEn = 'CI Urgent'; nameAr = 'عاجل جدا'; color = 'red'; icon = 'bolt'; sortOrder = 5; isActive = $true; firstResponseMinutes = 10; resolutionMinutes = 60 }
            $cg = Api Get catalog $null
            Check 'catalog: category, subcategory, type link and field' ((@($cg.categories | Where-Object { $_.id -eq $cat.id -and $_.subcategories.Count -eq 1 -and $_.typeIds -contains $tt.id }).Count -eq 1) -and (@($cg.fields | Where-Object id -eq $fld.id).Count -eq 1))
            $sla = Api Get sla $null
            Check 'new priority has SLA targets' (@($sla.policies | Where-Object { $_.priority -eq $pr.code -and $_.firstResponseMinutes -eq 10 }).Count -eq 1)
            $bh = Api Post business-hours @{ name = 'CI Hours'; timezone = 'Africa/Cairo'; isDefault = $false; schedule = @{ sun = @(,@('08:00','16:00')); mon = @(,@('08:00','16:00')) } }
            Api Post "business-hours/$($bh.id)/holidays" @{ date = '2030-01-01'; name = 'CI Holiday' } | Out-Null
            Api Put "sla/$($pr.code)" @{ firstResponseMinutes = 15; resolutionMinutes = 90; warningThresholdPct = 75; pauseOnPendingCustomer = $true; pauseOnPendingInternal = $false; businessHoursId = $bh.id; warnNotify = @('agent'); breachNotify = @('agent','admin') } | Out-Null
            $sla = Api Get sla $null
            Check 'SLA target, calendar and holiday saved' ((@($sla.policies | Where-Object { $_.priority -eq $pr.code -and $_.resolutionMinutes -eq 90 -and $_.businessHoursId -eq $bh.id }).Count -eq 1) -and (@($sla.hours | Where-Object { $_.id -eq $bh.id -and $_.holidays.Count -eq 1 }).Count -eq 1))
            Api Delete "priorities/$($pr.code)" $null | Out-Null
            Api Delete "fields/$($fld.id)" $null | Out-Null
            try { Api Delete "ticket-types/$($tt.id)" $null | Out-Null; $code = 200 } catch { $code = [int]$_.Exception.Response.StatusCode }
            Check "the last visible ticket type is protected (got $code)" ($code -eq 400)
            Api Delete "categories/$($cat.id)" $null | Out-Null
            Check 'catalog items without tickets can be deleted' ($true)
            $flow = Api Get status-flow $null
            Api Put status-flow @{ rows = @($flow.transitions) } | Out-Null
            Check "status flow saves ($(@($flow.transitions).Count) moves)" (@($flow.transitions).Count -gt 5)
            Api Put status-labels/open @{ staffEn = 'Ready'; tone = 'ok' } | Out-Null
            $siteNow = Invoke-RestMethod https://ccs.test/api/site -Headers @{ 'Cache-Control' = 'no-cache' }
            Check 'renamed status is stored' (@((Api Get status-flow $null).labels | Where-Object { $_.key -eq 'StaffStatus.open' -and $_.body -eq 'Ready' }).Count -eq 1)
            Api Put status-labels/open @{} | Out-Null
            $cr = Api Post closure-reasons @{ nameEn = 'CI reason'; nameAr = 'سبب'; customerMayReopen = $true; isActive = $true; sortOrder = 50 }
            Api Delete "closure-reasons/$($cr.code)" $null | Out-Null
            Api Put escalation @{ mode = 'next'; organizationIds = @($org.id); branchIds = @($br.id) } | Out-Null
            Check 'escalation mode saved' (@((Api Get escalation $null).orgs | Where-Object { $_.id -eq $org.id -and $_.mode -eq 'next' }).Count -eq 1)
            $kc = Api Post kb-categories @{ nameEn = 'CI Help'; nameAr = 'مساعدة'; slug = ''; sortOrder = 1; isActive = $true }
            $ka = Api Post kb-articles @{ categoryId = $kc.id; slug = 'ci-reset-password'; titleEn = 'How to reset a password'; bodyEn = 'Open the sign-in page and choose Forgot password.'; status = 'published'; visibility = 'public' }
            $pub = Invoke-RestMethod https://ccs.test/api/kb/ci-reset-password
            Check 'public help article readable without sign-in' ($pub.titleEn -eq 'How to reset a password')
            $pop = @(Invoke-RestMethod https://ccs.test/api/kb/popular)
            Check 'popular help articles listed' ($pop.slug -contains 'ci-reset-password')
            $cn = Invoke-RestMethod https://ccs.test/api/canned -Method Post -Headers $h -ContentType 'application/json' -Body (@{ title = 'CI hello'; body = 'Hello, thanks for contacting us.'; language = 'any'; isShared = $true } | ConvertTo-Json)
            Check 'saved reply created and listed' (@((Invoke-RestMethod https://ccs.test/api/canned -Headers $h).items | Where-Object id -eq $cn.id).Count -eq 1)
            $dash = Invoke-RestMethod https://ccs.test/api/console/dashboard -Headers $h
            Check "dashboard figures ($(@($dash.daily).Count) days, $($dash.kpi.orgs) organizations)" (@($dash.daily).Count -ge 30 -and $dash.kpi.orgs -ge 1)
            $cnt = Invoke-RestMethod https://ccs.test/api/console/counts -Headers $h
            Check 'queue counters and team SLA strip' ($null -ne $cnt.strip -and $null -ne $cnt.dueSoon)
            $bad = Invoke-RestMethod https://ccs.test/api/console/badges -Headers $h
            Check 'sidebar counts' ($null -ne $bad.tickets)
            $lst = Invoke-RestMethod 'https://ccs.test/api/tickets?group=open&sla=breached&view=escalated&search=x' -Headers $h
            Check 'queue filters (active, SLA, escalated, customer search)' ($null -ne $lst.total)
            function Cfg($m, $u, $b) { if ($null -eq $b) { Invoke-RestMethod "https://ccs.test/api/admin/settings/$u" -Method $m -Headers $h } else { Invoke-RestMethod "https://ccs.test/api/admin/settings/$u" -Method $m -Headers $h -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes(($b | ConvertTo-Json -Depth 6))) } }
            $br0 = Cfg Get branding $null
            $br0.siteNameEn = 'CI Care'; $br0.brandColor = '#123456'
            Cfg Put branding $br0 | Out-Null
            Check 'branding saved and shown on the site' ((Invoke-RestMethod https://ccs.test/api/site).site.siteNameEn -eq 'CI Care')
            $png = Join-Path $env:TEMP 'ci-logo.png'; [IO.File]::WriteAllBytes($png, [Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='))
            $up = Invoke-RestMethod https://ccs.test/api/admin/settings/branding/logo -Method Post -Headers $h -Form @{ file = Get-Item $png }
            Check 'logo uploaded and served' ((Invoke-WebRequest "https://ccs.test/api/site/branding/$($up.path)" -UseBasicParsing).StatusCode -eq 200)
            Cfg Put system @{ settings = @{ reopen_window_days = 15; email_enabled = $false; password_min_length = 12 } } | Out-Null
            Check 'system rules saved' ((Cfg Get system $null).settings.reopen_window_days -eq '15')
            Cfg Put signin-codes @{ enabled = $true; audience = 'customers'; codeLength = 6; validMinutes = 10; maxAttempts = 5; cooldownSeconds = 60; dailyLimit = 10 } | Out-Null
            Cfg Put templates @{ event = 'ticket_created'; locale = 'en'; subject = 'We got {reference}'; body = 'Thanks {name}'; button = ''; link = '' } | Out-Null
            Check 'email template saved' (@(Cfg Get templates $null | Where-Object { $_.event -eq 'ticket_created' }).Count -ge 1)
            Cfg Delete templates/ticket_created/en $null | Out-Null
            Cfg Put messages @{ key = 'Console.title'; en = 'Queue'; ar = '' } | Out-Null
            Check 'system message override stored' (@((Invoke-RestMethod https://ccs.test/api/site).systemMessages | Where-Object { $_.key -eq 'Console.title' }).Count -eq 1)
            Cfg Put messages @{ key = 'Console.title'; en = ''; ar = '' } | Out-Null
            Cfg Put uploads @{ maxMb = 12; maxFiles = 4; extensions = @('pdf','png') } | Out-Null
            Cfg Post menus @{ area = 'footer'; kind = 'link'; labelEn = 'Help'; labelAr = 'مساعدة'; href = '/kb'; audience = 'all'; newTab = $false; isVisible = $true; sortOrder = 10 } | Out-Null
            $menus = Cfg Get menus $null
            Check "menus listed ($(@($menus).Count))" (@($menus).Count -ge 1)
            Check 'handover screen data' ($null -ne (Cfg Get handover $null).demo)
            $rep = Invoke-RestMethod 'https://ccs.test/api/reports/summary?days=30' -Headers $h
            Check "reports overview ($(@($rep.daily).Count) days)" (@($rep.daily).Count -ge 30)
            $bld = Invoke-RestMethod 'https://ccs.test/api/reports/builder?kind=organization' -Headers $h
            Check 'report builder' ($null -ne $bld.rows)
            $csv = Invoke-WebRequest 'https://ccs.test/api/reports/export?kind=builder&report=status' -Headers $h -UseBasicParsing
            Check 'CSV export' ($csv.Headers['Content-Type'] -match 'text/csv')
            $slar = Invoke-RestMethod https://ccs.test/api/reports/sla -Headers $h
            Check 'SLA report' ($null -ne $slar.firstResponse)
            $aud = Invoke-RestMethod https://ccs.test/api/admin/audit -Headers $h
            Check "audit log ($($aud.total) entries)" ($aud.total -gt 0)
            $mt = Invoke-RestMethod https://ccs.test/api/console/my-team -Headers $h
            Check 'my team' ($null -ne $mt)
            # People: an Organization Admin manages the people in their scope.
            $oty = Api Post account-types @{ nameEn = 'CI Org Admin'; nameAr = 'مدير'; allAccess = $false; scopeLevel = 'organization'; permissions = @('reply','assign_others','customers_view'); access = @() }
            $oa = Api Post users @{ fullName = 'CI Org Admin'; email = 'orgadmin@ccs.test'; password = 'Str0ng!Passw0rd'; role = 'team_leader'; accountTypeId = $oty.id }
            Api Put "users/$($oa.id)/scope" @{ orgs = @($org.id); branches = @() } | Out-Null
            $where = Api Get "users/$($oa.id)/where" $null
            Check 'admin sets a scoped admin''s organizations' ($where.scopeLevel -eq 'organization' -and @($where.scopes).Count -eq 1)
            Api Put "users/$($agent.id)/placements" @{ orgs = @($org.id); branches = @($br.id) } | Out-Null
            Check 'admin sets where a staff member works' (@((Api Get "users/$($agent.id)/where" $null).placements | Where-Object branchId -eq $br.id).Count -eq 1)
            $oas = Invoke-RestMethod https://ccs.test/api/auth/sign-in -Method Post -ContentType 'application/json' -Body (@{ identifier = 'orgadmin@ccs.test'; password = 'Str0ng!Passw0rd' } | ConvertTo-Json)
            $oh = @{ Authorization = "Bearer $($oas.accessToken)" }
            $pp = Invoke-RestMethod https://ccs.test/api/console/people -Headers $oh
            Check 'scoped admin sees their organization' (@($pp.orgs | Where-Object id -eq $org.id).Count -eq 1)
            $np = Invoke-RestMethod https://ccs.test/api/console/people -Method Post -Headers $oh -ContentType 'application/json' -Body (@{ kind = 'customer'; fullName = 'CI Scoped Customer'; email = 'scoped@ccs.test'; password = 'Str0ng!Passw0rd'; organizationId = $org.id } | ConvertTo-Json)
            $pp = Invoke-RestMethod https://ccs.test/api/console/people -Headers $oh
            Check 'scoped admin creates a customer in scope' (@($pp.people | Where-Object id -eq $np.id).Count -eq 1)
            Invoke-RestMethod "https://ccs.test/api/console/people/$($np.id)/status" -Method Post -Headers $oh -ContentType 'application/json' -Body '{"status":"suspended"}' | Out-Null
            Check 'scoped admin suspends a person' (@((Invoke-RestMethod https://ccs.test/api/console/people -Headers $oh).people | Where-Object { $_.id -eq $np.id -and $_.status -eq 'suspended' }).Count -eq 1)
            $other = Api Post organizations @{ name = 'CI Other Org'; isActive = $true; sharedAccessEnabled = $false }
            try { Invoke-RestMethod https://ccs.test/api/console/people -Method Post -Headers $oh -ContentType 'application/json' -Body (@{ kind = 'customer'; fullName = 'Out Of Scope'; email = 'out@ccs.test'; password = 'Str0ng!Passw0rd'; organizationId = $other.id } | ConvertTo-Json) | Out-Null; $code = 200 } catch { $code = [int]$_.Exception.Response.StatusCode }
            Check "scoped admin cannot create outside scope (got $code)" ($code -eq 403)
            try { Invoke-RestMethod https://ccs.test/api/console/people -Headers @{ Authorization = "Bearer $((Invoke-RestMethod https://ccs.test/api/auth/sign-in -Method Post -ContentType 'application/json' -Body (@{ identifier = 'agent@ccs.test'; password = 'Str0ng!Passw0rd' } | ConvertTo-Json)).accessToken)" } | Out-Null; $code = 200 } catch { $code = [int]$_.Exception.Response.StatusCode }
            Check "agent without scope refused People (got $code)" ($code -eq 403)
            $c2 = Api Post users @{ fullName = 'CI Phone Customer'; email = 'phone@ccs.test'; password = 'Str0ng!Passw0rd'; role = 'customer'; organizationId = $org.id }
            $dir = @(Invoke-RestMethod https://ccs.test/api/tickets/customers -Headers $h)
            Check 'customers listed for a staff-created ticket' ($dir.id -contains $c2.id)
            # Attachments: staff create a ticket for the customer, add a file, download it back; a disallowed type is refused.
            $cat2 = Api Post categories @{ nameEn = 'CI Files'; nameAr = 'ملفات'; isActive = $true; sortOrder = 2; autoAssign = $false; isPrivate = $false }
            $tt2 = Api Post ticket-types @{ nameEn = 'CI Files Type'; nameAr = 'نوع ملفات'; sortOrder = 2; isActive = $true; categoryIds = @($cat2.id) }
            try { $tkt = Invoke-RestMethod https://ccs.test/api/tickets -Method Post -Headers $h -ContentType 'application/json' -Body (@{ typeId = $tt2.id; categoryId = $cat2.id; subject = 'Printer is offline'; description = 'The office printer stopped working this morning.'; requesterId = $c2.id } | ConvertTo-Json) } catch { Write-Host "create ticket failed: $($_.ErrorDetails.Message)"; throw }
            Check 'staff create a ticket for a customer' ($tkt.id)
            $txt = Join-Path $env:RUNNER_TEMP 'ci-note.txt'; Set-Content $txt 'hello attachment' -NoNewline
            $att = Invoke-RestMethod "https://ccs.test/api/tickets/$($tkt.id)/attachments" -Method Post -Headers $h -Form @{ file = Get-Item $txt }
            $back = Invoke-WebRequest "https://ccs.test/api/tickets/$($tkt.id)/attachments/$($att.id)" -Headers $h -UseBasicParsing
            Check 'attachment uploaded and downloaded' ([Text.Encoding]::UTF8.GetString($back.Content) -eq 'hello attachment')
            $det = Invoke-RestMethod "https://ccs.test/api/tickets/$($tkt.id)" -Headers $h
            Check 'attachment shown on the ticket' ((@($det.messages | Where-Object kind -eq 'ticket_files').attachments.id) -contains $att.id)
            $exe = Join-Path $env:RUNNER_TEMP 'ci-bad.exe'; Set-Content $exe 'MZ' -NoNewline
            try { Invoke-RestMethod "https://ccs.test/api/tickets/$($tkt.id)/attachments" -Method Post -Headers $h -Form @{ file = Get-Item $exe } | Out-Null; $code = 200 } catch { $code = [int]$_.Exception.Response.StatusCode }
            Check "disallowed file type refused (got $code)" ($code -eq 400)
          } else { Write-Host 'SKIP  admin API checks (administrator needs a second sign-in step)' }
          $login = sqlcmd -S localhost -E -h -1 -W -Q "SET NOCOUNT ON; SELECT name FROM sys.server_principals WHERE name = N'IIS APPPOOL\CcsApi'"
          Check 'API connects with the IIS APPPOOL\CcsApi Windows login' ("$login" -match 'CcsApi')
          $hf = sqlcmd -S localhost -E -d CCS -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.tables WHERE schema_id = SCHEMA_ID('HangFire')"
          Check "Hangfire created its tables ($hf)" ([int]"$hf".Trim() -gt 0)
          $ft = sqlcmd -S localhost -E -d CCS -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.fulltext_indexes"
          Check "full-text index exists ($ft)" ([int]"$ft".Trim() -ge 1)
      - name: Separate API site (api.ccs.test), then back to one site
        shell: pwsh
        run: |
          function Check($name, $ok) { if ($ok) { Write-Host "PASS  $name" } else { throw "FAIL  $name" } }
          & D:\Releases\ci\Install-Ccs.ps1 -HostName ccs.test -ApiHostName api.ccs.test -Quiet
          Check 'API answers on its own site' ((Invoke-WebRequest https://api.ccs.test/api/health -UseBasicParsing).Content -match 'Healthy')
          Check 'website knows the API address' ((Invoke-RestMethod https://ccs.test/config.json).apiBase -eq 'https://api.ccs.test')
          $pre = Invoke-WebRequest https://api.ccs.test/api/auth/refresh -Method Options -UseBasicParsing -Headers @{ Origin = 'https://ccs.test'; 'Access-Control-Request-Method' = 'POST' }
          Check 'API allows the website (CORS)' ("$($pre.Headers['Access-Control-Allow-Origin'])" -eq 'https://ccs.test' -and "$($pre.Headers['Access-Control-Allow-Credentials'])" -eq 'true')
          $csp = (Invoke-WebRequest https://ccs.test/en -UseBasicParsing).Headers['Content-Security-Policy']
          Check 'browser rule allows calls to the API' ("$csp" -match "connect-src 'self' https://api.ccs.test")
          & D:\Releases\ci\Install-Ccs.ps1 -HostName ccs.test -Quiet
          Check 'back to one site: API under /api' ((Invoke-WebRequest https://ccs.test/api/health -UseBasicParsing).Content -match 'Healthy')
          Check 'one site: separate API site removed' (-not (Get-Website -Name ccs-api))
      - name: Logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem C:\CcsData\logs -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 80 }
          Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -match 'IIS|ASP.NET|\.NET' } | Format-List TimeCreated, ProviderName, Message
