name: CI

# All checks run on Windows Server 2022 build machines (rented from GitHub for each run, then deleted),
# the same OS as production:
#   1. build      - compile, run the unit tests, build Angular, make the IIS release package
#   2. deploy-test - install SQL Server 2022 (with Full-Text Search), IIS, Hosting Bundle and URL Rewrite,
#                    run deploy/Install-Ccs.ps1 exactly as on the real server, then test through HTTPS
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, package (Windows Server 2022)
    runs-on: windows-2022
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Ccs.Web/package-lock.json
      - name: Restore and build
        run: |
          dotnet restore Ccs.slnx
          dotnet build Ccs.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test Ccs.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory test-results
      - name: Publish API (win-x64, framework-dependent)
        run: dotnet publish src/Ccs.Api/Ccs.Api.csproj -c Release -r win-x64 --self-contained false -o release/ccs-api
      - name: Build web
        working-directory: src/Ccs.Web
        run: |
          npm ci
          npx ng build --configuration production
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/ccs-web, release/database, release/migration, release/docs | Out-Null
          Copy-Item -Recurse src/Ccs.Web/dist/Ccs.Web/browser/* release/ccs-web/
          Copy-Item database/* release/database/ -Recurse
          Copy-Item migration/* release/migration/ -Recurse
          Copy-Item docs/* release/docs/ -Recurse
          Copy-Item deploy/Install-Ccs.ps1, deploy/Install-Ccs.cmd release/
          "commit $env:GITHUB_SHA built $(Get-Date -Format o)" | Set-Content release/VERSION.txt
      - uses: actions/upload-artifact@v6
        with:
          name: ccs-v2-release-${{ github.sha }}
          path: release
          retention-days: 30
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: test-results

  deploy-test:
    name: Deploy to IIS + SQL Server 2022 and test (Windows Server 2022)
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ccs-v2-release-${{ github.sha }}
          path: D:\Releases\ci
      - name: Install SQL Server 2022 Developer with Full-Text Search
        shell: pwsh
        run: |
          choco install sql-server-2022 -y --no-progress --params="'/IgnorePendingReboot /FEATURES:SQLENGINE,FULLTEXT /INSTANCENAME:MSSQLSERVER'"
          if ($LASTEXITCODE -notin 0, 3010) { throw "SQL Server install failed: $LASTEXITCODE" }
          $tools = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\Client SDK\ODBC' -Recurse -Filter sqlcmd.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tools) { $tools.DirectoryName | Out-File -Append $env:GITHUB_PATH }
      - name: Install IIS roles, Hosting Bundle, URL Rewrite
        shell: pwsh
        run: |
          Install-WindowsFeature Web-Server, Web-Default-Doc, Web-Static-Content, Web-Http-Errors, Web-Http-Logging, `
            Web-Request-Monitor, Web-Filtering, Web-Stat-Compression, Web-Dyn-Compression, Web-AppInit, Web-WebSockets, `
            Web-Mgmt-Console -IncludeManagementTools | Out-Null
          Invoke-WebRequest https://aka.ms/dotnet/10.0/dotnet-hosting-win.exe -OutFile $env:TEMP\hosting.exe
          Start-Process $env:TEMP\hosting.exe -ArgumentList '/install', '/quiet', '/norestart' -Wait
          choco install urlrewrite -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "URL Rewrite install failed: $LASTEXITCODE" }
          net stop was /y; net start w3svc
      - name: Run Install-Ccs.ps1 (same script as production)
        shell: pwsh
        run: |
          Add-Content "$env:windir\System32\drivers\etc\hosts" "`n127.0.0.1 ccs.test"
          & D:\Releases\ci\Install-Ccs.ps1 -HostName ccs.test -AdminEmail admin@ccs.test -AdminPassword 'Str0ng!Passw0rd' -Quiet
      - name: Run it again (update path must be safe)
        shell: pwsh
        run: '& D:\Releases\ci\Install-Ccs.ps1 -HostName ccs.test -Quiet'
      - name: Smoke tests through https://ccs.test
        shell: pwsh
        run: |
          function Check($name, $ok) { if ($ok) { Write-Host "PASS  $name" } else { throw "FAIL  $name" } }
          $home_ = Invoke-WebRequest https://ccs.test/en -UseBasicParsing
          Check 'home page /en serves Angular' ($home_.StatusCode -eq 200 -and $home_.Content -match '<app-root')
          Check 'stylesheet loads without inline script (CSP-safe)' ($home_.Content -match '<link rel="stylesheet" href="styles-[^"]+\.css">' -and $home_.Content -notmatch 'media="print"')
          $deep = Invoke-WebRequest https://ccs.test/ar/tickets -UseBasicParsing
          Check 'deep link /ar/tickets falls back to index.html' ($deep.StatusCode -eq 200 -and $deep.Content -match '<app-root')
          $h = Invoke-WebRequest https://ccs.test/api/health -UseBasicParsing
          Check 'API health at /api' ($h.Content -match 'Healthy')
          Check 'HSTS header' ($home_.Headers['Strict-Transport-Security'] -match 'max-age')
          Check 'CSP header' ($home_.Headers['Content-Security-Policy'] -match "default-src 'self'")
          $site = Invoke-RestMethod https://ccs.test/api/site
          Check 'site settings JSON' ($null -ne $site)
          try { Invoke-WebRequest https://ccs.test/api/tickets -UseBasicParsing | Out-Null; $code = 200 } catch { $code = [int]$_.Exception.Response.StatusCode }
          Check "anonymous /api/tickets refused (got $code)" ($code -eq 401)
          $body = @{ identifier = 'admin@ccs.test'; password = 'Str0ng!Passw0rd' } | ConvertTo-Json
          $session = Invoke-RestMethod https://ccs.test/api/auth/sign-in -Method Post -ContentType 'application/json' -Body $body
          Check 'administrator signs in' ($session.accessToken -or $session.token -or $session.mfaToken)
          if ($session.accessToken) {
            $h = @{ Authorization = "Bearer $($session.accessToken)" }
            function Api($m, $u, $b) { if ($null -eq $b) { Invoke-RestMethod "https://ccs.test/api/admin/$u" -Method $m -Headers $h } else { Invoke-RestMethod "https://ccs.test/api/admin/$u" -Method $m -Headers $h -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes(($b | ConvertTo-Json -Depth 5))) } }
            $org = Api Post organizations @{ name = 'CI Org'; isActive = $true; sharedAccessEnabled = $false }
            Check 'admin creates an organization' ($org.id)
            $br = Api Post branches @{ organizationId = $org.id; name = 'CI Branch'; isActive = $true }
            Check 'admin creates a branch' ($br.id)
            $team = Api Post teams @{ nameEn = 'CI Team'; nameAr = 'فريق'; isActive = $true }
            Check 'admin creates a team' ($team.id)
            $agent = Api Post users @{ fullName = 'CI Agent'; email = 'agent@ccs.test'; password = 'Str0ng!Passw0rd'; role = 'agent' }
            Check 'admin creates a staff member' ($agent.id)
            Api Put "teams/$($team.id)/members" @{ members = @(@{ userId = $agent.id; isLeader = $false }) } | Out-Null
            $teams = Api Get teams $null
            Check 'team has the new member' (($teams.teams | Where-Object id -eq $team.id).members.Count -eq 1)
            $ty = Api Post account-types @{ nameEn = 'CI Type'; nameAr = 'نوع'; allAccess = $false; permissions = @('reply'); access = @(@{ organizationId = $org.id }) }
            Api Put "account-types/$($ty.id)" @{ nameEn = 'CI Type 2'; nameAr = 'نوع 2'; allAccess = $true; permissions = @('reply','resolve'); access = @() } | Out-Null
            $types = @(Api Get account-types $null)
            Check 'account types list and edit' (@($types | Where-Object { $_.id -eq $ty.id -and $_.nameEn -eq 'CI Type 2' -and $_.permissions.Count -eq 2 }).Count -eq 1)
            $cust = Api Post users @{ fullName = 'CI Customer'; email = 'cust@ccs.test'; password = 'Str0ng!Passw0rd'; role = 'customer'; organizationId = $org.id; branchId = $br.id }
            $list = Api Get 'users?kind=customers' $null
            Check 'customers list shows the new customer' (@($list | Where-Object id -eq $cust.id).Count -eq 1)
            Api Delete "users/$($cust.id)" $null | Out-Null
            try { Api Delete "organizations/$($org.id)" $null | Out-Null; $code = 200 } catch { $code = [int]$_.Exception.Response.StatusCode }
            Check "organization in use is protected (got $code)" ($code -eq 409)
          } else { Write-Host 'SKIP  admin API checks (administrator needs a second sign-in step)' }
          $login = sqlcmd -S localhost -E -h -1 -W -Q "SET NOCOUNT ON; SELECT name FROM sys.server_principals WHERE name = N'IIS APPPOOL\CcsApi'"
          Check 'API connects with the IIS APPPOOL\CcsApi Windows login' ("$login" -match 'CcsApi')
          $hf = sqlcmd -S localhost -E -d CCS -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.tables WHERE schema_id = SCHEMA_ID('HangFire')"
          Check "Hangfire created its tables ($hf)" ([int]"$hf".Trim() -gt 0)
          $ft = sqlcmd -S localhost -E -d CCS -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.fulltext_indexes"
          Check "full-text index exists ($ft)" ([int]"$ft".Trim() -ge 1)
      - name: Logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem C:\CcsData\logs -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 80 }
          Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -match 'IIS|ASP.NET|\.NET' } | Format-List TimeCreated, ProviderName, Message
