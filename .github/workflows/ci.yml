name: CI

# Every push and pull request: compile and test the .NET solution, run the SQL scripts on a real
# SQL Server 2022, build the Angular app. On main it also produces the IIS release package.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Ccs.slnx
      - run: dotnet build Ccs.slnx -c Release --no-restore
      - run: dotnet test Ccs.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  database:
    name: SQL scripts on SQL Server 2022
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Passw0rd!2026"
        ports: [ "1433:1433" ]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Passw0rd!2026' -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install sqlcmd
        run: |
          if ! command -v sqlcmd >/dev/null; then
            curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc >/dev/null
            curl -sSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
            sudo apt-get update -q && sudo ACCEPT_EULA=Y apt-get install -y -q mssql-tools18 unixodbc-dev
            echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
          fi
      - name: Create database and run scripts 01-02 (03 needs Full-Text Search, not in the Linux image)
        env:
          SQLCMDPASSWORD: "Ci_Passw0rd!2026"
        run: |
          S="sqlcmd -C -S localhost -U sa -b"
          $S -Q "CREATE DATABASE CCS COLLATE Latin1_General_100_CI_AS_SC; ALTER DATABASE CCS SET READ_COMMITTED_SNAPSHOT ON;"
          $S -d CCS -i database/01_schema.sql
          $S -d CCS -i database/02_seed.sql
          $S -d CCS -i database/02_seed.sql        # seed must be safe to run twice
          $S -d CCS -Q "SELECT COUNT(*) AS ccs_tables FROM sys.tables t JOIN sys.schemas s ON s.schema_id=t.schema_id WHERE s.name='ccs'"
      - name: API starts against the database and reports healthy
        env:
          ConnectionStrings__Ccs: "Server=localhost;Database=CCS;User Id=sa;Password=Ci_Passw0rd!2026;TrustServerCertificate=True;Encrypt=True"
          Jwt__SigningKey: "Y2ktb25seS1zaWduaW5nLWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNlLTEyMzQ1Njc4OTA="
          FileStore__Root: /tmp/ccs/attachments
          DataProtection__KeysFolder: /tmp/ccs/keys
          Serilog__WriteTo__0__Name: Console
          ASPNETCORE_URLS: http://localhost:5080
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          mkdir -p /tmp/ccs/attachments /tmp/ccs/keys
          dotnet run --project src/Ccs.Api -c Release > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5080/api/health >/dev/null 2>&1; then echo "healthy after ${i}s"; break; fi
            sleep 2
          done
          curl -fsS http://localhost:5080/api/health || (cat api.log; exit 1)
          echo; curl -fsS http://localhost:5080/api/site | head -c 400; echo
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5080/api/tickets)
          echo "GET /api/tickets without sign-in -> $code"; test "$code" = "401"
      - if: failure()
        run: cat api.log || true

  web:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Ccs.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Ccs.Web/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production

  release:
    name: IIS release package
    if: github.ref == 'refs/heads/main'
    needs: [ dotnet, database, web ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Ccs.Web/package-lock.json
      - name: Publish API (framework-dependent, win-x64)
        run: dotnet publish src/Ccs.Api/Ccs.Api.csproj -c Release -r win-x64 --self-contained false -o release/ccs-api
      - name: Build web
        working-directory: src/Ccs.Web
        run: |
          npm ci
          npx ng build --configuration production
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/ccs-web, release/database, release/migration, release/docs | Out-Null
          Copy-Item -Recurse src/Ccs.Web/dist/Ccs.Web/browser/* release/ccs-web/
          Copy-Item database/* release/database/ -Recurse
          Copy-Item migration/* release/migration/ -Recurse
          Copy-Item docs/* release/docs/ -Recurse
          Copy-Item deploy/* release/ -Recurse -ErrorAction SilentlyContinue
          "commit $env:GITHUB_SHA built $(Get-Date -Format o)" | Set-Content release/VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ccs-v2-release-${{ github.sha }}
          path: release
          retention-days: 30
